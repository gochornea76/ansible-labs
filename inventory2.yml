---
# Crear archivo CSV
- hosts: localhost
  gather_facts: false

  tasks:
    - name: Crear CSV
      copy:
        dest: /tmp/inventario_servidores.csv
        content: |
          IP,HOSTNAME,SO,DISCO_ROOT,MEM_TOTAL_MB,MEM_USED_MB,MEM_FREE_MB

# Inventario servidores
- hosts: servidores
  gather_facts: false

  tasks:

    - name: Hostname
      raw: hostname
      register: hostname

    - name: Sistema Operativo
      raw: cat /etc/redhat-release
      register: so

    - name: Disco Root
      raw: df -h / | tail -1 | awk '{print $5}'
      register: disco

    - name: Memoria
      raw: free -m | grep Mem
      register: memoria

    - name: Mostrar resumen
      debug:
        msg:
          - "HOST={{ hostname.stdout | trim }}"
          - "SO={{ so.stdout | trim }}"
          - "DISCO_ROOT={{ disco.stdout | trim }}"
          - "MEM_TOTAL_MB={{ memoria.stdout.split()[1] }}"
          - "MEM_USED_MB={{ memoria.stdout.split()[2] }}"
          - "MEM_FREE_MB={{ memoria.stdout.split()[3] }}"

    - name: Agregar fila CSV
      delegate_to: localhost
      lineinfile:
        path: /tmp/inventario_servidores.csv
        insertafter: EOF
        create: yes
        line: "{{ inventory_hostname | trim }},{{ hostname.stdout | trim }},{{ so.stdout | trim | replace(',', ';') }},{{ disco.stdout | trim }},{{ memoria.stdout.split()[1] }},{{ memoria.stdout.split()[2] }},{{ memoria.stdout.split()[3] }}"

    - name: Mostrar ubicacion CSV
      debug:
        msg: "Archivo actualizado: /tmp/inventario_servidores.csv"
