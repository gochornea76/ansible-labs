---
- hosts: localhost
  gather_facts: false

  tasks:
    - name: Crear CSV
      copy:
        dest: /tmp/inventario_servidores.csv
        content: |
          IP,HOSTNAME,SO,DISCO_ROOT,MEM_TOTAL_MB,MEM_USED_MB,MEM_FREE_MB

- hosts: servidores
  gather_facts: false

  tasks:

    - name: Hostname
      raw: hostname
      register: hostname

    - name: Sistema Operativo
      raw: cat /etc/redhat-release
      register: so

    - name: Disco Root
      raw: df -h / | tail -1 | awk '{print $5}'
      register: disco

    - name: Memoria
      raw: free -m | grep Mem
      register: memoria

    - name: Mostrar resumen
      debug:
        msg: |
          Host: {{ hostname.stdout }}
          SO: {{ so.stdout }}
          Disco: {{ disco.stdout }}
          Memoria: {{ memoria.stdout }}

    - name: Agregar fila CSV
      delegate_to: localhost
      lineinfile:
        path: /tmp/inventario_servidores.csv
        line: "{{ inventory_hostname }},{{ hostname.stdout }},{{ so.stdout | replace(',', ';') }},{{ disco.stdout }},{{ memoria.stdout.split()[1] }},{{ memoria.stdout.split()[2] }},{{ memoria.stdout.split()[3] }}"
