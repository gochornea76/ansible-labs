---
- hosts: servidores
  gather_facts: false

  tasks:

    - raw: hostname
      register: hostname

    - raw: cat /etc/redhat-release
      register: so

    - raw: df -h / | tail -1
      register: disco

    - debug:
        msg: >
          HOST={{ hostname.stdout }}
          | SO={{ so.stdout }}
          | DISCO={{ disco.stdout }}
