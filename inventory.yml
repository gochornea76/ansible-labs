---
- hosts: servidores
  gather_facts: false

  tasks:

    - raw: hostname
      register: hostname

    - raw: cat /etc/redhat-release
      register: so

    - raw: df -h /
      register: disk

    - debug:
        msg:
          - "Host: {{ hostname.stdout }}"
          - "SO: {{ so.stdout }}"
          - "Disco: {{ disk.stdout_lines }}"
